spring.application.name=product-api

# MySQL connection. Update username/password to match your local MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For a small practice project: create/update table structure automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql after Hibernate creates/updates tables.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080
